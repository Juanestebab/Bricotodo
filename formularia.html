<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="stylesform.css">
</head>
<body>
    <h1>Formulario de informacion</h1>
    <form action="formulario.php" method="get">
        <fieldset>
            <legend>Sus datos</legend>
            <p>
                <label for="nom-ape">Nombre y Apellidos</label>
                <input type="text" name="nom-ape" id="nom-ape" max="50" min="4" required>
            </p>
            <p>
                <label for="contra">Contraseña</label>
                <input type="password" name="Contraseña" id="contra" max="8" min="4">
            </p>
            <p>
                <label for="user">Usuario</label>
                <input type="text" name="usuario" id="user" value="anonimo">
            </p>
            <p>Nivel:</p>
            <p>
                <input type="radio" name="nivel" id="profe">
                <label for="profe">Profesional</label>
            </p>
            <p>
                <input type="radio" name="nivel" id="avan"
                 checked>
                <label for="avan">Avanzado</label>
            </p>
            <p>
                <input type="radio" name="nivel" id="princi">
                <label for="princi">Principiante</label>
            </p>
        </fieldset>
        <p>
            <label for="nacio">Nacionalidad :</label>
            <select name="nacio" id="nacio">
                <option value="selec">seleccionar nacionalidad</option>
                <option value="esp">España</option>
                <option value="fran">Francia</option>
                <option value="ital">Italy</option>
            </select>
        </p>
        <p>
            <label for="des">Descripcion :</label>
            <textarea name="desc" id="des" rows="5" cols="25"></textarea>
        </p>
        <p>
            <input type="checkbox" name="deseo" id="deseo" checked>
            <label for="deseo">Deseo recibir informacion sobre novedades y ofertas</label>
        </p>
        <p>
            <input type="checkbox" name="declaro" id="declaro">
            <label for="deseo">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre proteccion de datos</label>
        </p>
        <p>
            <label for="adj">adjuntar foto:</label>
            <input type="file" name="adj" id="adj">
        </p>
        <p>
            <input type="submit" id="enviar">
            <input type="reset" value="Borrar Datos" id="reset">
        </p>
    </form>
    
</body>
</html>
